# UAV Piston Engine Simulator Configuration
# Based on engine_model_specification_v0.3.txt
# All parameters are for a generic 4-cylinder, 4-stroke, naturally aspirated, spark-ignition aircraft piston engine

engine:
  # Basic engine geometry
  n_cyl: 4                    # Number of cylinders
  displacement: 0.0060        # Total displacement [m³] (6.0 L, typical for 360-400 cu.in. class)
  stroke: 0.111               # Stroke [m] (111 mm)
  bore: 0.131                 # Bore [m] (131 mm)

  # Compression and thermodynamics
  r: 8.5                      # Compression ratio (coincidentally matches FOCA O-360, but this is a generic engine)
  gamma: 1.3                  # Ratio of specific heats for combustion products (ASSUMED)

  # Mechanical
  J: 0.5                      # Crankshaft rotational inertia [kg·m²] (ASSUMED, typical for this class)
  omega_idle_rpm: 650         # Idle speed [RPM]
  N_floor: 300                # Numerical floor for RPM [RPM] (§4.6a - purely numerical guard)

  # Efficiency parameters (ASSUMED - require calibration)
  eta_ind_real: 0.70          # Real indicated efficiency (fraction of ideal Otto-cycle power actually achieved)
  target_mech_eff_at_rated: 0.88  # Target mechanical efficiency at rated power (used to derive friction coefficients)

  # Friction model
  T_friction0: 120.0          # Friction torque constant term [N·m] (CONFIG - to be calibrated)
  c_friction: 0.35            # Friction torque linear coefficient [N·m·s/rad] (CONFIG - to be calibrated)

  # Volumetric efficiency model (§4.2)
  eta_v_max: 0.85             # Maximum volumetric efficiency (ASSUMED)
  k_v: 0.3                    # VE decay coefficient (ASSUMED)
  N_ref: 2400                 # Reference RPM for VE curve [RPM] (ASSUMED)

  # Energy split parameters (§4.8)
  k_reject_to_exhaust: 0.6    # Fraction of ideal-cycle rejection heat going to exhaust (NEW in v0.3, ASSUMED)
  k_split_exhaust: 0.5        # Fraction of real-cycle losses going to exhaust vs engine heat (ASSUMED)
  k_cyl_split: 0.7            # Fraction of combustion-sourced engine heat going to CHT vs oil (ASSUMED)

fuel:
  LHV: 43.5e6                 # Lower heating value of AVGAS [J/kg] (REF)
  AFR_target: 13.0            # Target air-fuel ratio (mass basis) (CONFIG - rich of stoichiometric for best power)
  # Note: Stoichiometric AFR for AVGAS ≈ 14.6:1 per FOCA, so 13.0 → λ ≈ 0.89 (best-power region)

atmosphere:
  # ISA model parameters (REF - standard atmosphere)
  T_sl: 288.15                # Sea-level temperature [K]
  p_sl: 101325                # Sea-level pressure [Pa]
  L: 0.0065                   # Temperature lapse rate [K/m]
  R: 287.05                   # Specific gas constant for air [J/(kg·K)]
  g: 9.80665                  # Gravitational acceleration [m/s²]

thermal:
  # CHT model (§4.9)
  C_CHT: 15000                # CHT thermal capacitance [J/K] (CONFIG - typical for aluminum head, to be calibrated)
  h_cool_base: 300            # Base cooling coefficient [W/(m²·K)] (CONFIG - to be calibrated)
  A_fin: 0.5                  # Effective finned cooling area [m²] (CONFIG - to be calibrated)
  T_ambient_offset: 273.15    # Offset for Celsius to Kelvin conversion

  # EGT model (§4.9)
  tau_EGT: 1.5                # EGT time constant [s] (ASSUMED - representative only)

  # Oil temperature model (§4.9)
  C_oil: 20000                # Oil thermal capacitance [J/K] (CONFIG - typical for ~6L oil, to be calibrated)
  h_oilcool: 400              # Oil cooler heat transfer coefficient [W/(m²·K)] (CONFIG - to be calibrated)
  A_oilcooler: 0.25           # Oil cooler effective area [m²] (CONFIG - to be calibrated)

lubrication:
  # Oil pressure model (§4.10)
  k_pump: 0.002               # Pump coefficient [Pa·s/RPM] (CONFIG - to be calibrated)
  mu_ref: 0.050               # Reference oil viscosity [Pa·s] at T_ref (CONFIG)
  b: 0.03                     # Viscosity temperature coefficient [1/K] (ASSUMED)
  T_ref: 363.15               # Reference temperature for viscosity [K] (90°C) (CONFIG)
  P_oil_max: 620000           # Maximum oil pressure [Pa] (~90 psi, REF-bounded)
  P_oil_min: 70000            # Minimum oil pressure [Pa] (~10 psi, practical floor)

vibration:
  # Vibration proxy model (§4.11)
  k_v1: 0.001                 # Vibration coefficient 1 [units vary, ASSUMED] (CONFIG - to be calibrated)
  k_v2: 0.0001                # Vibration coefficient 2 [units vary, ASSUMED] (CONFIG - to be calibrated)

propeller:
  # Propeller/load model (§4.7)
  k_load: 0.008               # Load coefficient [N·m·s²/rad²] (CONFIG - to be calibrated)
  # T_load = k_load * omega^2

sensor:
  # Sensor noise/bias model (§4.12)
  noise_rpm: 5.0              # RPM measurement noise std dev [RPM]
  noise_cht: 2.0              # CHT measurement noise std dev [°C]
  noise_egt: 5.0              # EGT measurement noise std dev [°C]
  noise_oil_temp: 1.0         # Oil temperature noise std dev [°C]
  noise_oil_pressure: 2000    # Oil pressure noise std dev [Pa]
  noise_fuel_flow: 0.01       # Fuel flow noise std dev [kg/s]
  noise_vibration: 0.05       # Vibration noise relative std dev [fraction]

simulation:
  dt: 0.1                     # Default time step [s]
  output_format: "csv"        # Output telemetry format